name: Release Please
on:
  push:
    branches:
      - main
  # Manually publish a prerelease (e.g. 2.0.0-rc.0) under the `next` dist-tag
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version to publish (e.g. 2.0.0-rc.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          # npm trusted publishing needs npm >= 11.5.1, bundled with Node 24
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: pnpm install

      - name: Build package
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: pnpm build

      - name: Set prerelease version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Prereleases can only be published from main"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "::error::'$VERSION' is not a prerelease version (expected e.g. 2.0.0-rc.0)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version

      - name: Publish package
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        # Authenticates via OIDC (trusted publishing); provenance is generated automatically
        env:
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'next' || 'latest' }}
        run: npm publish --access public --tag "$DIST_TAG"
